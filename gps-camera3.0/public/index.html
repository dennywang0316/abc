<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
 
  
  <link rel="manifest" href="manifest.json" />

  <title>gps camera</title>

  <link rel="stylesheet" type="text/css" href="style.css">


  <script src="lib/p5.js"></script>
  <script src="lib/mappa.js" type="text/javascript"></script>
  <script src="lib/p5.sound.js"></script>
  <script src="socket.io/socket.io.js"></script>  

</head>

<body>
  <button id="requestOrientationButton" onclick="requestGPS()" style="position:fixed;top:20px;left:20px;">request GPS</button>
  <button id="downloadTraceButton">Download trace</button>
  <a id="traceDownloadLink" style="display:none;"></a>
  <div id="tracePreviewOverlay" class="trace-preview-overlay">
    <div class="trace-preview-content">
      <button id="tracePreviewClose" aria-label="Close preview">×</button>
      <img id="tracePreviewImage" alt="Trace export preview">
      <p>Long press to download image</p>
    </div>
  </div>
  <!-- <button id="unlock">UNLOCK</button>
  <button id="deleteLast">DELETE LAST CAMERA</button> -->
 
  <div class="main-wrapper">
    <!-- <h1>Project Title</h1> -->

    <!-- the following div will contain the p5 canvas. -->
    <div id="p5-canvas-container">
      <!-- p5 canvas will be appended here. -->
    </div>

    <!-- <p>Project Description</p> -->
  </div>


  <!-- function to request orientation -->
  <script src="requestGPS.js"></script> 
  <!-- the script tag below should always be at the bottom, right before the closing body tag -->
  <script src="sketch.js"></script>
</body>

</html>
