<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <link rel="manifest" href="manifest.json" />
    <title>Bubble Connect</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="/socket.io/socket.io.js"></script>
  </head>

  <body>
    <button
      id="requestOrientationButton"
      onclick="requestOrientation()"
      style="position: fixed; top: 20px; left: 20px; z-index: 1000"
    >
      Request Orientation
    </button>
    <div class="main-wrapper">
      <div id="statusWrapper">
        <p id="connectionStatus">connecting...</p>
      </div>
      <div id="bridgeWrapper">
        <canvas id="bridgeCanvas" width="300" height="200"></canvas>
      </div>
    </div>

    <script src="audio.js"></script>
    <script src="draw.js"></script>
    <script src="script.js"></script>
  </body>
</html>
